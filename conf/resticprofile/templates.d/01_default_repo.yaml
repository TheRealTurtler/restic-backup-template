# Declare Variables
{{ $USER_NAME     := "<<USER_NAME>>" }}
{{ $REPO_TYPE     := "<<REPO_TYPE>>" }}
{{ $REPO_BASE_DIR := "<<REPO_BASE_DIR>>" }}
{{ $PASSWORD_FILE := "<<PASSWORD_FILE>>" }}

default:
  # Repository and password file
  repository: "{{ $REPO_TYPE }}:{{ $REPO_BASE_DIR }}{{ $USER_NAME }}/backup/{{ .Profile.Name }}"
  password-file: "{{ .ConfigDir }}/../secrets/{{ $PASSWORD_FILE }}"
