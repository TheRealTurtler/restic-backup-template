# Declare Variables
{{ $REPO_TYPE     := "<<REPO_TYPE>>" }}
{{ $REPO_DIR := "<<REPO_DIR>>" }}
{{ $PASSWORD_FILE := "<<PASSWORD_FILE>>" }}

default:
  # Repository and password file
  repository: "{{ $REPO_TYPE }}:{{ $REPO_DIR }}{{ .Profile.Name }}"
  password-file: "{{ .ConfigDir }}/../secrets/{{ $PASSWORD_FILE }}"
