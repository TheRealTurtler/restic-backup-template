userdata:
  inherit: "default"

  initialize: false

  lock: "{{ .ConfigDir }}/../lock/resticprofile_userdata.lock"

  backup:
    # Backup directories
    source:
      - '{{ .Env.USERPROFILE }}\.'

    # Excluded directories
    iexclude:
      # Usually we don't want to backup ourself
      - "{{ .ConfigDir }}/.."

    # Files containing exclude patterns (environment variables can be used here)
    exclude-file:
      - "{{ .ConfigDir }}/../conf/resticprofile/profiles_user.d/{{ .Profile.Name }}_exclude_default.txt"
      - "{{ .ConfigDir }}/../conf/resticprofile/profiles_user.d/{{ .Profile.Name }}_exclude_custom.txt"

    # Tags
    tag:
      - "{{ .Profile.Name }}"
      - "{{ .OS }}"

    # Schedule
    schedule: "monthly"

  check:
    # Schedule
    schedule: "weekly"
