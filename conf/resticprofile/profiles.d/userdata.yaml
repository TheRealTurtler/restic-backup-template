userdata:
  inherit: "default"

  initialize: true

  backup:
    # Backup directories
    source:
      - '{{ .Env.USERPROFILE }}\'

    # Excluded directories
    iexclude:
      # Usually we don't want to backup ourself
      - "{{ .ConfigDir }}/.."

      # Let's be real, no one cleans the download folder
      - '{{ .Env.USERPROFILE }}\Downloads'

      # AppData contains a lot of volatile or redundant data
      - '{{ .Env.USERPROFILE }}\AppData'

      # Cloud storage folders are already synced externally
      - '{{ .Env.USERPROFILE }}\Dropbox'
      - '{{ .Env.USERPROFILE }}\Google Drive'
      - '{{ .Env.USERPROFILE }}\Nextcloud'
      - '{{ .Env.USERPROFILE }}\OneDrive'

      # Common dotfolders that contain caches, build artifacts, or redundant config
      # These are excluded explicitly to avoid losing .ssh or other critical folders
      - '{{ .Env.USERPROFILE }}\.cache'
      - '{{ .Env.USERPROFILE }}\.vscode'
      - '{{ .Env.USERPROFILE }}\.platformio'
      - '{{ .Env.USERPROFILE }}\.npm'
      - '{{ .Env.USERPROFILE }}\.cargo'
      - '{{ .Env.USERPROFILE }}\.conda'
      - '{{ .Env.USERPROFILE }}\.jupyter'
      - '{{ .Env.USERPROFILE }}\.matplotlib'
      - '{{ .Env.USERPROFILE }}\.idea'
      - '{{ .Env.USERPROFILE }}\.gradle'
      - '{{ .Env.USERPROFILE }}\.terraform'
      - '{{ .Env.USERPROFILE }}\.config'
      - '{{ .Env.USERPROFILE }}\.local'
      - '{{ .Env.USERPROFILE }}\.crossnote'

    # Tags
    tag:
      - "{{ .Profile.Name }}"
      - "{{ .OS }}"

    # Execute weekly
    # schedule: "weekly"

  check:
    # Execute daily
    # schedule: "daily"
