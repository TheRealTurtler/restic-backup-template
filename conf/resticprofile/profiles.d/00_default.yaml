# Default profile when not specified on the command line (-n or --name)
# There's no default inheritance from the 'default' profile,
# you can use the 'inherit' flag if needed
default:
  # Don't Initialize repository if missing
  initialize: false

  # TODO
  # Lock-file
  #lock: "{{ .ConfigDir }}/../lock/resticprofile_{{ .Profile.Name }}.lock"
  force-inactive-lock: true

  # Remove old cache directories
  cache-cleanup: true
  # Set cache directory
  cache-dir: "{{ .ConfigDir }}/../cache"

  # Command hooks
  run-before:
    - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-before.ps1'
  run-after:
    - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-after.ps1'
  run-after-fail:
    - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-after-fail.ps1'
  run-finally:
    - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-finally.ps1'

  # Backup command
  backup:
    # Show more log data
    verbose: true
    # Exclude cache directories
    exclude-caches: true

    # Schedule settings
    # -> To enable scheduled backups set interval with "schedule"
    schedule-permission: "user"
    schedule-priority: "background"
    schedule-log: "{{ .ConfigDir }}/../log/schedule_{{ .Profile.Name }}_backup.log"
    schedule-lock-mode: "default"
    schedule-lock-wait: "2h"
    schedule-after-network-online: true

    # Check repository after succesfull backup
    check-after: true

    # Command hooks
    run-before:
      - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks/$Env:PROFILE_COMMAND" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-before.ps1'
    run-after:
      - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks/$Env:PROFILE_COMMAND" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-after.ps1'
    run-after-fail:
      - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks/$Env:PROFILE_COMMAND" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-after-fail.ps1'
    run-finally:
      - 'Set-Location "{{ .ConfigDir }}/../scripts/command-hooks/$Env:PROFILE_COMMAND" ; Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass ; ./run-finally.ps1'

  # Check command
  check:
    # Read data and not just metadata
    read-data: true

    # Schedule settings
    # -> To enable scheduled backups set interval with "schedule"
    schedule-permission: "user"
    schedule-priority: "background"
    schedule-log: "{{ .ConfigDir }}/../log/schedule_{{ .Profile.Name }}_check.log"
    schedule-lock-mode: "default"
    schedule-lock-wait: "2h"
    schedule-after-network-online: true

  # Retention Policy
  # Retention is a special section that runs the "forget" command automatically before/after a backup
  # This can NOT be run manually!
  retention:
    before-backup: false
    after-backup: true

    # Never delete snapshots with these tags
    keep-tag:
      - "forever"

    keep-daily: 1
    keep-hourly: 1
    keep-weekly: 1
    keep-monthly: 3
    keep-within: "3h"

    # Only delete snapshots from this host
    host: true
    # Only delete snapshots with the same paths
    paths: true
    # Only delete snapshots with tags specified in backup
    tags: true

    # Automatically run "prune" if snapshots were removed
    prune: true

  # Forget is used to delete snapshots that don't fit the specified policy
  # This can be run manually
  forget:
    # Never delete snapshots with these tags
    keep-tag:
      - "forever"

    keep-daily: 1
    keep-hourly: 1
    keep-weekly: 1
    keep-monthly: 3
    keep-within: "3h"

    # Only delete snapshots from this host
    host: true
    # Only delete snapshots with the same paths
    paths: true
    # Only delete snapshots with tags specified in backup
    tags: true

    # Automatically run "prune" if snapshots were removed
    prune: true
